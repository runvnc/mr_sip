[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr_sip"
version = "1.0.0"
description = "MindRoot SIP phone integration plugin with voice transcription and TTS"
authors = [{name = "MindRoot Team"}]
requires-python = ">=3.8"
dependencies = [
    "baresipy",
    "numpy>=1.21.0,<2.3",
    "scipy>=1.7.0",
    "JACK-Client>=0.5.0",
    "pydub>=0.25.0",
    "asyncio",
    "inotify>=0.2.10",
    "websockets>=12.0",
    "websocket-client",
    "deepgram-sdk>=3.0.0",
    "soundfile>=0.13.1",
    "PySIPio @ git+https://github.com/runvnc/PySIP.git",
]

[project.optional-dependencies]
silero-cohere = [
    "silero-vad",
]
smart-turn-v3 = [
    "silero-vad",
    "onnxruntime-gpu>=1.18.0",
    "huggingface_hub>=0.20.0",
    "transformers",
]
local-stt = [
    "silero-vad",
    "onnxruntime-gpu>=1.18.0",
    "huggingface_hub>=0.20.0",
    "transformers",
]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mr_sip = ["*.py"]
